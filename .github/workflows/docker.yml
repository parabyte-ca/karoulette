name: Test, build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/karoulette

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e:
    # Browser tests: a TV, phones and the host remote against a real server, in Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend packages
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA and install Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        env:
          KQ_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  load:
    # 30 phones join, queue and cheer at once; fails if requests or updates get slow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend packages
        run: pip install -r backend/requirements.txt
      - name: Load test
        working-directory: backend
        env:
          DATA_PATH: ${{ runner.temp }}/karoulette-load
          STATIC_DIR: ${{ runner.temp }}/no-frontend
          HOST_PIN: "2468"
          ENABLE_YTDLP: "false"
          UPDATE_CHECK: "false"
        run: |
          python -m uvicorn --factory app.main:create_app --host 127.0.0.1 --port 8095 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8095/api/health >/dev/null && break; sleep 1; done
          python -m scripts.loadtest --base http://127.0.0.1:8095 --pin 2468 || { cat server.log; exit 1; }

  docker:
    needs: [test, e2e, load]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
