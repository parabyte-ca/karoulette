# Weekly dependency, base image and GitHub Actions updates (versions must be a week old). Security updates
# arrive as soon as an advisory is published (enable "Dependabot security updates" in Settings > Code security).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 7       # skip versions younger than a week (fresh releases are where compromises land)
    groups:
      python-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 7       # skip versions younger than a week (fresh releases are where compromises land)
    groups:
      npm-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 7       # skip versions younger than a week (fresh releases are where compromises land)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    cooldown:
      default-days: 7       # skip versions younger than a week (fresh releases are where compromises land)
    groups:
      actions:
        patterns: ["*"]
