services:
  karoulette:
    image: ${KQ_IMAGE:-parabyte-ca/karoulette}:${KQ_TAG:-latest}
    build:
      context: .
    container_name: karoulette
    restart: unless-stopped
    user: "${PUID:-568}:${PGID:-568}"
    env_file:
      - .env
    environment:
      DATA_PATH: /data
      # Shared with the host's upgrade helper (scripts/upgrade-agent.sh) for Host admin > Updates.
      UPGRADE_DIR: /upgrade
    ports:
      - "${KQ_PORT:-8095}:8000"
    volumes:
      - ${KQ_DATA_DIR:-./data}:/data
      - ${KQ_UPGRADE_FOLDER:-./upgrade}:/upgrade
